# cargo-deny configuration (§10.4)
# License allowlist only; copyleft requires a recorded decision — default reject.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Recorded decision (§10.4, §10.9 waiver): Unicode-3.0 is the Unicode
    # License v3, the successor of the already-allowed Unicode-DFS-2016
    # (OSI-approved, permissive, not copyleft). Required by `unicode-ident`
    # 1.0.27, a transitive dependency of serde/thiserror/proc-macro2 — the
    # crate was re-licensed from Unicode-DFS-2016 to (MIT OR Apache-2.0) AND
    # Unicode-3.0, which broke the allowlist for every workspace crate.
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # Recorded decision (§10.4): CC0-1.0 is the license of `notify`, the
    # spec-mandated vault watcher crate (§2, D2; workspace-pinned
    # `notify = "8"`, consumed by flavite-fs `watch.rs` in slice C5 and by the
    # S3 watcher probe in PLAN-C C1). CC0-1.0 is a public-domain dedication,
    # not copyleft.
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
