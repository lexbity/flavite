# cargo-deny configuration (§10.4)
# License allowlist only; copyleft requires a recorded decision — default reject.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # unicode-ident (via proc-macro2/syn/thiserror, in the tree since A1)
    # declares (MIT OR Apache-2.0) AND Unicode-3.0 — the Unicode Consortium's
    # OSI-approved permissive license, same family as Unicode-DFS-2016.
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
