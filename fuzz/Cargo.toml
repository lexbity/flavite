[package]
name = "flavite-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the parent workspace (§10.6): this is a cargo-fuzz workspace,
# excluded from the root workspace's members. Application builds never
# compile it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
# These path dependencies support both maintained smoke targets and prototype
# targets. Smoke membership is intentionally listed in the root justfile.
flavite-fs = { path = "../crates/flavite-fs" }
flavite-syntax = { path = "../crates/flavite-syntax" }
flavite-buffer = { path = "../crates/flavite-buffer" }
flavite-vault = { path = "../crates/flavite-vault" }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"

[[bin]]
name = "image_limits"
path = "fuzz_targets/image_limits.rs"

[[bin]]
name = "path_safety"
path = "fuzz_targets/path_safety.rs"

[[bin]]
name = "scanner"
path = "fuzz_targets/scanner.rs"

[[bin]]
name = "frontmatter_patcher"
path = "fuzz_targets/frontmatter_patcher.rs"

[[bin]]
name = "parity"
path = "fuzz_targets/parity.rs"

[[bin]]
name = "rename_planner"
path = "fuzz_targets/rename_planner.rs"
