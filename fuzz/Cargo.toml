[package]
name = "flavite-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the parent workspace (§10.6): this is a cargo-fuzz workspace,
# excluded from the root workspace's members. Application builds never
# compile it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
# flavite-syntax / flavite-fs path deps are added by PLAN-C slices as their
# fuzz targets appear (scanner, frontmatter_patcher, rename_planner,
# path_safety, parity).

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"

[[bin]]
name = "image_limits"
path = "fuzz_targets/image_limits.rs"