# CI — required gate (Phase 1 of devdocs/plans/ci-gate-backend-headless-2026-11-08.md).
#
# Thin caller: all gate logic lives in justfile recipes. This workflow runs
# exactly one required job, `gate`, on all three OSes, and NOTHING may run
# before it in the job — an early failure must never skip the test gate
# (audit 2026-11-08 finding C2: the G0 step was skipped in 52/52 observed
# runs because visual steps preceded it).
#
# Scope: backend + headless tests only. Xvfb/GPU/visual smoke lives in
# visual.yml (non-blocking). Probes, linux-extras and negative tests are
# re-added as separate required jobs in Phases 3-4 of the plan.
#
# All actions are pinned to full commit SHAs (audit H5); Dependabot
# (github-actions ecosystem) maintains the pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-rust-

      # Installs rust components, nightly, cargo sub-tools, and rg (the
      # source-gate scripts require it; runners don't ship it — audit H4).
      - name: Setup (tools + nightly + rg)
        run: just setup

      # G0: fmt + clippy + test + fault-tests + lint-arch + arch-check +
      # workspace-contracts + gc. First and only build step of this job.
      # NOTE: no GPU adapter is required — FLAVITE_REQUIRE_WGPU_ADAPTER is
      # deliberately unset, so the shader link half skips honestly here;
      # the lavapipe-backed run lives in visual.yml.
      - name: Gate (G0)
        run: just gate
