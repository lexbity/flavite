# CI — required gate (Phases 1/3/4/7 of
# devdocs/plans/ci-gate-backend-headless-2026-11-08.md).
#
# Thin caller: all gate logic lives in justfile recipes. The required check is
# the `gate` job, which runs `just gate` as its first substantive step and
# NOTHING may run before it in the job — an early failure must never skip the
# test gate (audit 2026-11-08 finding C2: the G0 step was skipped in 52/52
# observed runs because visual steps preceded it).
#
# Scope: backend + headless tests only, LINUX ONLY. flavite does not support
# macOS/Windows yet (deferred by product decision, 2026-11-09) — those legs
# are excluded until support lands. Known blockers when re-enabling:
# macOS needs `cap_std` in flavite-fs deps; Windows needs the `windows-sys`
# features used by the xtask fs-semantics probe (Win32_Storage_FileSystem etc.).
# Re-enable by adding the OS to the matrix below.
#
# Jobs (all required; enumerated in the main ruleset in Phase 8):
#   gate-fmt-clippy   G0 part 1 — `just fmt` + `just clippy`
#   gate-test         G0 part 2 — `just test` + `just fault-tests`
#   gate-arch         G0 part 3 — `just lint-arch` + `just arch-check` +
#                     `just workspace-contracts` + `just gc`
#                     (G0 split into 3 parallel jobs 2026-11-09 so wall time
#                     is max() not sum(); local `just gate` still runs all G0)
#   linux-extras-supply-chain / -coverage / -msrv-fuzz
#                     G1 extras — one `just ci-extras-*` recipe per job, each on
#                     a fresh runner with its own disk budget, plus a disk
#                     preflight. The old single linux-extras job stacked G0 +
#                     doc + llvm-cov + network-denied + MSRV + fuzz into one
#                     target/ and died with ENOSPC during `cc` linking
#                     (2026-11-11). CI runs the same recipes local
#                     `just ci-gate` composes, so CI == local (D-9)
#   probe-watcher     watcher probe, scenarios 1-3, --self-check (FR-4)
#   probe-fs          fs-semantics probe, all scenarios, --self-check
#   probe-search      search probe, 2k notes, --self-check
#   probe-db          DB probe, 2k notes, --self-check
#   negative-tests    seeded arch-edges / arch-layering / coverage violations
#                     must be detected (FR-6, D-6, AC-28/29)
#   lint-workflows    zizmor audit + grep gates (Phase 7: SHA pins, no
#                     pull_request_target/workflow_run, timeout-minutes and
#                     permissions on every job)
#
# Xvfb/GPU/visual smoke lives in visual.yml (non-blocking, manual only).
# Long/deep runs (1 h fuzz per target, bench-scale) live in weekly-deep.yml
# (advisory, scheduled).
#
# Triggers: push/PR of new code on main, and tag pushes (v*) for new
# releases. No other automatic runs.
#
# All actions are pinned to full commit SHAs (audit H5); Dependabot
# (github-actions ecosystem, .github/dependabot.yml) maintains the pins.
# Every pinned action targets Node.js 24 natively, so runs emit no
# "Node.js 20 is deprecated" warnings.
# `just` is pinned via setup-just's just-version (zizmor unpinned-tools).
# checkout never persists credentials (zizmor artipacked) and rust-cache is
# lookup-only on pull_request runs so a fork PR can never write the shared
# cache (zizmor cache-poisoning).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # new release
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # G0 is split into three parallel jobs (2026-11-09) so a cold run costs
  # max() instead of sum(). Each job runs its checks as the FIRST substantive
  # step after setup — nothing may precede them (audit C2: a gate step must
  # never be skipped because earlier steps failed). Runner pinned to Ubuntu
  # 26.04 (not ubuntu-latest); macOS/Windows stay out until official support
  # lands — see header comment.
  gate-fmt-clippy:
    name: gate-fmt-clippy (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      # zizmor: ignore[cache-poisoning]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          # v2 restores the latest prefix-matching cache automatically;
          # `restore-keys` is not a valid input on this version (run
          # 42548285621 annotation).
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          # PR runs may only read the cache, never write it (cache-poisoning).
          lookup-only: ${{ github.event_name == 'pull_request' }}

      # Installs rust components, nightly, cargo sub-tools (prebuilt via the
      # pinned cargo-binstall — see xtask/src/setup.rs), and rg (the
      # source-gate scripts require it; runners don't ship it — audit H4).
      - name: Setup (tools + nightly + rg)
        run: just setup

      - name: fmt + clippy
        run: |
          just fmt
          just clippy

  gate-test:
    name: gate-test (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      # zizmor: ignore[cache-poisoning] — PR runs are lookup-only below.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup (tools + nightly + rg)
        run: just setup

      - name: test + fault-tests
        run: |
          just test
          just fault-tests

  gate-arch:
    name: gate-arch (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      # zizmor: ignore[cache-poisoning] — PR runs are lookup-only below.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup (tools + nightly + rg)
        run: just setup

      # NOTE: no GPU adapter is required on any gate leg —
      # FLAVITE_REQUIRE_WGPU_ADAPTER is deliberately unset, so the shader
      # link half skips honestly here; the lavapipe-backed run lives in
      # visual.yml.
      - name: lint-arch + arch-check + workspace-contracts + gc
        run: |
          just lint-arch
          just arch-check
          just workspace-contracts
          just gc

  # G1 extras — the `just ci-gate` extras, split into one job per recipe group
  # so each runs on a FRESH runner with its own disk budget. The old single
  # linux-extras job stacked G0 + doc + llvm-cov + network-denied + MSRV +
  # fuzz builds into one target/ and died with ENOSPC during `cc` linking of
  # flavite-cli (2026-11-11). G0 is NOT re-run here — needs: [gate-*] already
  # proved it, and the gate-* jobs keep G0 as their first substantive step
  # (audit C2). Local `just ci-gate` composes exactly these recipes after
  # `gate`, so CI == local at the recipe level (D-9).
  # Linux-only: llvm-cov, cargo-fuzz and unshare -n are Linux-only tools.
  # Every job runs a disk preflight after cache restore (fail fast with a
  # clear message instead of ENOSPC mid-link) and logs disk usage after the
  # run. The ci-extras-* recipes themselves call `just gc` between heavy
  # phases to reclaim space (§10.10).
  linux-extras-supply-chain:
    name: linux-extras-supply-chain (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [gate-fmt-clippy, gate-test, gate-arch]
    env:
      # Disk relief: no incremental caches; line-tables-only debug info
      # (full debug=2 is the bulk of target/ on a disk-limited runner).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('fuzz/Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup (tools + nightly + rg)
        run: just setup

      - name: Disk preflight (after cache restore)
        run: |
          set -euo pipefail
          df -h /
          free_gib="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "Free on / after cache restore: ${free_gib} GiB (need >= 8)"
          if [ "$free_gib" -lt 8 ]; then
            echo "Under 8 GiB — running 'just gc' to reclaim restored caches, then re-checking"
            just gc || true
            free_gib="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
            echo "Free on / after gc: ${free_gib} GiB"
            if [ "$free_gib" -lt 8 ]; then
              echo "FAIL: still under 8 GiB free on / — refusing to build (would hit ENOSPC mid-link)"
              exit 1
            fi
          fi

      - name: G1 extras — supply chain (doc + deny + audit + shear)
        run: just ci-extras-supply-chain

      - name: Disk usage after run
        if: always()
        run: df -h /

  # Heaviest disk user: the full-workspace instrumented llvm-cov build, then
  # (after `just gc` inside the recipe) the network-denied test rebuild.
  # Debug info stays full here on purpose — llvm-cov needs it for accurate
  # line mapping; only incremental caches are disabled.
  linux-extras-coverage:
    name: linux-extras-coverage (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [gate-fmt-clippy, gate-test, gate-arch]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      # zizmor: ignore[cache-poisoning] — PR runs are lookup-only below.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('fuzz/Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup (tools + nightly + rg)
        run: just setup

      - name: Disk preflight (after cache restore)
        run: |
          set -euo pipefail
          df -h /
          free_gib="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "Free on / after cache restore: ${free_gib} GiB (need >= 8)"
          if [ "$free_gib" -lt 8 ]; then
            echo "Under 8 GiB — running 'just gc' to reclaim restored caches, then re-checking"
            just gc || true
            free_gib="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
            echo "Free on / after gc: ${free_gib} GiB"
            if [ "$free_gib" -lt 8 ]; then
              echo "FAIL: still under 8 GiB free on / — refusing to build (would hit ENOSPC mid-link)"
              exit 1
            fi
          fi

      - name: G1 extras — coverage floors + network-denied (gc between phases)
        run: just ci-extras-coverage

      - name: Disk usage after run
        if: always()
        run: df -h /

  linux-extras-msrv-fuzz:
    name: linux-extras-msrv-fuzz (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [gate-fmt-clippy, gate-test, gate-arch]
    env:
      # Disk relief: no incremental caches; line-tables-only debug info.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      # zizmor: ignore[cache-poisoning] — PR runs are lookup-only below.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('fuzz/Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup (tools + nightly + rg)
        run: just setup

      - name: Disk preflight (after cache restore)
        run: |
          set -euo pipefail
          df -h /
          free_gib="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "Free on / after cache restore: ${free_gib} GiB (need >= 8)"
          if [ "$free_gib" -lt 8 ]; then
            echo "Under 8 GiB — running 'just gc' to reclaim restored caches, then re-checking"
            just gc || true
            free_gib="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
            echo "Free on / after gc: ${free_gib} GiB"
            if [ "$free_gib" -lt 8 ]; then
              echo "FAIL: still under 8 GiB free on / — refusing to build (would hit ENOSPC mid-link)"
              exit 1
            fi
          fi

      - name: G1 extras — MSRV + fuzz build + fuzz smoke (gc between phases)
        run: just ci-extras-msrv-fuzz

      - name: Disk usage after run
        if: always()
        run: df -h /

  # --- Phase 4: self-checking headless probes (FR-4). Each probe re-runs a
  # scaled-down scenario set with `--self-check` and uploads its JSON report;
  # `if-no-files-found: error` makes a missing report a failure, not a pass.

  probe-watcher:
    name: probe-watcher (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: Watcher probe scenarios 1-3 with self-check (C1)
        run: just spike-watcher --scenarios 1,2,3 --self-check --json target/watcher-report.json
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watcher-report-linux
          path: target/watcher-report.json
          if-no-files-found: error

  probe-fs:
    name: probe-fs (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: fs-semantics probe, all scenarios, with self-check (C2)
        run: just spike-fs --scenarios all --self-check --json target/fs-report.json
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fs-report-linux
          path: target/fs-report.json
          if-no-files-found: error

  probe-search:
    name: probe-search (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: Search probe, 2k notes, with self-check (C3)
        run: just spike-search --scenarios all --notes 2000 --self-check --json target/search-report.json
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: search-report-linux
          path: target/search-report.json
          if-no-files-found: error

  probe-db:
    name: probe-db (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: DB probe, 2k notes, with self-check (C4)
        run: just spike-db --scenarios all --notes 2000 --dir target/db-probe --self-check --json target/db-report.json
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: db-report-linux
          path: target/db-report.json
          if-no-files-found: error

  # --- Phase 4: negative/meta tests (FR-6, DEBT-9, AC-28/29). Seed a
  # violation, then prove the gate detects it. Seeding is a SINGLE insert
  # (D-6: the old double seed crashed `cargo metadata` with a duplicate key
  # before the violation was ever checked) and `arch gen` has no `|| true` —
  # a broken manifest must fail loudly.
  negative-tests:
    name: negative-tests (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # PR runs are lookup-only (see below), so a fork PR cannot write the
      # shared cache. zizmor cannot prove that statically, hence the ignore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: ubuntu-26.04-rust-${{ hashFiles('Cargo.lock') }}
          lookup-only: ${{ github.event_name == 'pull_request' }}

      - name: arch-edges-negative (AC-28)
        run: |
          set -euo pipefail
          # One undocumented internal edge: flavite-syntax -> flavite-fs.
          python3 - <<'PY'
          path = 'crates/flavite-syntax/Cargo.toml'
          content = open(path).read()
          dep = 'flavite-fs = { path = "../flavite-fs" }'
          if '[dependencies]' not in content:
              content += '\n[dependencies]\n' + dep + '\n'
          else:
              content = content.replace('[dependencies]', '[dependencies]\n' + dep, 1)
          open(path, 'w').write(content)
          PY
          cargo xtask arch gen
          if cargo xtask arch check > arch-check.log 2>&1; then
            echo "AC-28 FAIL: arch check passed despite the seeded edge"
            exit 1
          fi
          grep -q "EDGES" arch-check.log || { echo "AC-28 FAIL: no EDGES marker in output"; cat arch-check.log; exit 1; }
          echo "AC-28 PASS: undocumented edge detected"
          git checkout -- crates xtask/arch Cargo.lock

      - name: arch-layering-negative (AC-28)
        run: |
          set -euo pipefail
          # iced (forbidden in the core tier) added to flavite-fs (core tier).
          python3 - <<'PY'
          path = 'crates/flavite-fs/Cargo.toml'
          content = open(path).read()
          dep = 'iced = "0.14"'
          if '[dependencies]' not in content:
              content += '\n[dependencies]\n' + dep + '\n'
          else:
              content = content.replace('[dependencies]', '[dependencies]\n' + dep, 1)
          open(path, 'w').write(content)
          PY
          cargo xtask arch gen
          if cargo xtask arch check > arch-check.log 2>&1; then
            echo "AC-28 FAIL: arch check passed despite the seeded layering violation"
            exit 1
          fi
          grep -q "LAYERING" arch-check.log || { echo "AC-28 FAIL: no LAYERING marker in output"; cat arch-check.log; exit 1; }
          echo "AC-28 PASS: layering violation detected"
          git checkout -- crates xtask/arch Cargo.lock

      - name: coverage-negative (AC-29)
        run: |
          set -euo pipefail
          # Doctored lcov: flavite-fs at 50% (tier-1 floor: 90%).
          mkdir -p target/llvm-cov
          cat > target/llvm-cov/lcov.info << 'EOF'
          SF:/project/crates/flavite-fs/src/lib.rs
          DA:1,1
          DA:2,0
          end_of_record
          EOF
          if just cov-check > cov-check.log 2>&1; then
            echo "AC-29 FAIL: cov-check passed on a below-floor lcov"
            exit 1
          fi
          grep -qE "FAIL|below|floor" cov-check.log || { echo "AC-29 FAIL: no floor signal in output"; cat cov-check.log; exit 1; }
          echo "AC-29 PASS: below-floor coverage detected"

  # --- Phase 7: workflow lint gate (NFR-6, AC-4/AC-5). zizmor is installed
  # from a pinned release with a sha256-verified download; the grep gates are
  # the cheap backstops that must hold even if zizmor's rules change.
  lint-workflows:
    name: lint-workflows (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install zizmor (pinned release, sha256-verified)
        run: |
          set -euo pipefail
          version="1.32.0"
          asset="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          expected_sha256="bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"
          curl -sSfL "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${asset}" -o zizmor.tar.gz
          actual_sha256="$(sha256sum zizmor.tar.gz | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "zizmor download checksum mismatch: got $actual_sha256" >&2
            exit 1
          fi
          tar -xzf zizmor.tar.gz
          ./zizmor --version

      - name: zizmor audit (offline — no API calls)
        run: ./zizmor --offline .github/

      - name: grep gates
        run: |
          set -euo pipefail
          # No floating action tags (a trailing "# vX" version comment is
          # allowed: the pattern stops at '#').
          if grep -rnE 'uses:[^#]*@v[0-9]' .github/workflows/; then
            echo "FAIL: floating action tag found" >&2
            exit 1
          fi
          # No dangerous triggers (as YAML keys) anywhere under .github/.
          if grep -rnE '^[[:space:]]*(pull_request_target|workflow_run):' .github/; then
            echo "FAIL: pull_request_target/workflow_run trigger found" >&2
            exit 1
          fi
          for f in .github/workflows/*.yml; do
            # Every job has timeout-minutes. Job keys sit at exactly 2 spaces
            # under `jobs:`; the key sits at exactly 4 spaces under a job.
            awk -v f="$f" '
              /^jobs:/ { in_jobs = 1; next }
              in_jobs && /^  [a-zA-Z0-9_-]+:$/ { jobs++ }
              in_jobs && /^[^ ]/ { in_jobs = 0 }
              /^ {4}timeout-minutes:/ { timeouts++ }
              END {
                if (jobs != timeouts) {
                  printf "FAIL: %s has %d jobs but %d timeout-minutes\n", f, jobs, timeouts > "/dev/stderr"
                  bad = 1
                }
                exit bad ? 1 : 0
              }
            ' "$f" || exit 1
            # Top-level permissions must be exactly contents: read
            # (single-line or two-line form).
            grep -qzP '(?m)^permissions:\s*contents:\s*read\s*$' "$f" || {
              echo "FAIL: $f is missing top-level 'permissions: contents: read'" >&2
              exit 1
            }
          done
          echo "grep gates passed"
