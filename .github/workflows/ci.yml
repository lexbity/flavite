# G1 — CI gate (§10.3, §10.7).
# Thin caller: all gate logic lives in justfile recipes.
# Matrix: ubuntu-latest, macOS-latest, windows-latest.
# Linux adds: coverage merge, fuzz smoke, network-denied run.

name: CI (G1)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  g1:
    name: G1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup (tools + nightly)
        run: just setup

      # Linux only: lavapipe, so the wgpu half of the S2-1 shader gate has a
      # device. See `just gpu-setup` for why this cannot be optional.
      - name: GPU setup (Linux only — lavapipe software Vulkan)
        if: matrix.os == 'ubuntu-latest'
        run: just gpu-setup

      - name: G0 (fmt + clippy + test + arch check)
        run: just gate
        env:
          # On Linux the step above installed lavapipe, so "no adapter" is a
          # real defect rather than an absent GPU — fail instead of skipping.
          # Elsewhere the value is empty and the test skips honestly.
          FLAVITE_REQUIRE_WGPU_ADAPTER: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

      # Linux-only: coverage merge + fuzz smoke + network-denied.
      - name: Coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --all-features --lcov --output-path target/llvm-cov/lcov.info
          just cov-check

      - name: Fuzz smoke 60 s (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: just fuzz-smoke-ci

      - name: Network-denied run (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: just network-denied

      - name: Doc build
        run: just doc

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit

      - name: MSRV build
        run: just msrv

  # PLAN-C slice C1: re-run watcher probe scenarios 1–3 on Linux headless and
  # verify the D5 nomination property (eventual path nomination or explicit
  # overflow). Measurements, never operation-count equality.
  s3-watcher-probe:
    name: S3 watcher probe (C1, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Probe scenarios 1–3 with self-check
        run: just spike-s3 --scenarios 1,2,3 --self-check --json target/s3-watcher-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: s3-watcher-report-linux
          path: target/s3-watcher-report.json
          if-no-files-found: error

  # C2 (§9 S3-2): filesystem-semantics probe — rename-over, symlink identity,
  # fsync, placeholder, advisory lock after kill -9, no-clobber rename. The
  # self-check asserts the `Fs` trait contract's per-OS assumptions on Linux.
  s3-fs-probe:
    name: S3 fs probe (C2, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Probe all scenarios with self-check
        run: just spike-s3-fs --scenarios all --self-check --json target/s3-fs-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: s3-fs-report-linux
          path: target/s3-fs-report.json
          if-no-files-found: error

  # C3 (§9 S4): search probe — CJK bigram quality vs plain, deferred commits
  # under autosave, committed_generation replay, atomic checkpoint publication.
  # CI re-runs the scaled-down (2k-note) self-check; the full probe is 20k.
  s4-search-probe:
    name: S4 search probe (C3, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Probe all scenarios (2k notes) with self-check
        run: just spike-s4-search --scenarios all --notes 2000 --self-check --json target/s4-search-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: s4-search-report-linux
          path: target/s4-search-report.json
          if-no-files-found: error

  # Negative tests (AC-28/29): seed violations, assert failure.
  arch-edges-negative:
    name: arch-edges-negative (AC-28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Seed undocumented internal edge
        run: |
          # Add a dependency from flavite-syntax to flavite-fs without
          # updating crates.toml. arch check must fail on the edges check.
          echo 'flavite-fs = { path = "../flavite-fs" }' >> crates/flavite-syntax/Cargo.toml
          echo '[dependencies]' >> /dev/null # no-op
          # Actually add the dep properly:
          python3 -c "
          content = open('crates/flavite-syntax/Cargo.toml').read()
          if '[dependencies]' not in content:
              content += '\n[dependencies]\nflavite-fs = { path = \"../flavite-fs\" }\n'
          else:
              content = content.replace('[dependencies]', '[dependencies]\nflavite-fs = { path = \"../flavite-fs\" }')
          open('crates/flavite-syntax/Cargo.toml', 'w').write(content)
          "
          cargo xtask arch gen || true
          if cargo xtask arch check 2>&1 | grep -q "EDGES"; then
            echo "AC-28 PASS: edges violation detected"
          else
            echo "AC-28 FAIL: edges violation not detected"
            exit 1
          fi

  arch-layering-negative:
    name: arch-layering-negative (AC-28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Seed layering violation (iced in core crate)
        run: |
          # Add iced to flavite-fs (a core-tier crate).
          python3 -c "
          content = open('crates/flavite-fs/Cargo.toml').read()
          if '[dependencies]' not in content:
              content += '\n[dependencies]\niced = \"0.14\"\n'
          else:
              content = content.replace('[dependencies]', '[dependencies]\niced = \"0.14\"')
          open('crates/flavite-fs/Cargo.toml', 'w').write(content)
          "
          cargo xtask arch gen || true
          if cargo xtask arch check 2>&1 | grep -q "LAYERING"; then
            echo "AC-28 PASS: layering violation detected"
          else
            echo "AC-28 FAIL: layering violation not detected"
            exit 1
          fi

  coverage-negative:
    name: coverage-negative (AC-29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Seed below-floor coverage
        run: |
          # Create a doctored lcov with flavite-fs at 50% (floor: 90%).
          mkdir -p target/llvm-cov
          cat > target/llvm-cov/lcov.info << 'EOF'
          SF:/project/crates/flavite-fs/src/lib.rs
          DA:1,1
          DA:2,0
          end_of_record
          EOF
          if just cov-check 2>&1 | grep -q "FAIL\|below\|floor"; then
            echo "AC-29 PASS: below-floor coverage detected"
          else
            echo "AC-29 FAIL: below-floor coverage not detected"
            exit 1
          fi
