# CI — required gate (Phase 1 of devdocs/plans/ci-gate-backend-headless-2026-11-08.md).
#
# Thin caller: all gate logic lives in justfile recipes. This workflow runs
# exactly one required job, `gate`, and NOTHING may run before it in the job —
# an early failure must never skip the test gate (audit 2026-11-08 finding
# C2: the G0 step was skipped in 52/52 observed runs because visual steps
# preceded it).
#
# Scope: backend + headless tests only, LINUX ONLY. flavite does not support
# macOS/Windows yet (deferred by product decision, 2026-11-09) — those legs
# are excluded until support lands. Known blockers when re-enabling:
# macOS needs `cap_std` in flavite-fs deps; Windows needs the `windows-sys`
# features used by xtask/src/spike_s3_fs.rs (Win32_Storage_FileSystem etc.).
# Re-enable by adding the OS to the matrix below (and to weekly fresh-clone).
#
# Xvfb/GPU/visual smoke lives in visual.yml (non-blocking). Probes,
# linux-extras and negative tests are re-added as separate required jobs in
# Phases 3-4 of the plan.
#
# All actions are pinned to full commit SHAs (audit H5); Dependabot
# (github-actions ecosystem) maintains the pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows deferred — see header comment.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # v2 restores the latest prefix-matching cache automatically;
          # `restore-keys` is not a valid input on this version (run
          # 42548285621 annotation).
          key: ${{ matrix.os }}-rust-${{ hashFiles('Cargo.lock') }}

      # Installs rust components, nightly, cargo sub-tools, and rg (the
      # source-gate scripts require it; runners don't ship it — audit H4).
      - name: Setup (tools + nightly + rg)
        run: just setup

      # G0: fmt + clippy + test + fault-tests + lint-arch + arch-check +
      # workspace-contracts + gc. First and only build step of this job.
      # NOTE: no GPU adapter is required — FLAVITE_REQUIRE_WGPU_ADAPTER is
      # deliberately unset, so the shader link half skips honestly here;
      # the lavapipe-backed run lives in visual.yml.
      - name: Gate (G0)
        run: just gate

  # G1 — the full CI gate, run verbatim from the same recipe a dev runs
  # locally (`just ci-gate`), so CI and local can never diverge (plan D-9).
  # Linux-only: llvm-cov, cargo-fuzz and unshare -n are Linux-only tools.
  linux-extras:
    name: linux-extras (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ubuntu-rust-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Setup (tools + nightly + rg)
        run: just setup

      - name: CI gate (G1) — just ci-gate
        run: just ci-gate
