# Hand-maintained architecture configuration (§10.2).
# This file is the SOURCE for `cargo xtask arch check`'s edge and layering
# checks. The generated artifacts (crate-graph.json, DEPENDENCIES.md) are
# derived from `cargo metadata` + this file. Do not hand-edit the generated
# files — update this file and run `cargo xtask arch gen`.

[tiers]
# Tier 1 — durability-critical (§10.5: ≥ 90% line coverage floor).
# Tier 1 — durability-critical (§10.5: ≥ 90% line coverage floor).
# RFC-0003 adds flavite-workspace: the IO-free layout model carries
# durability-adjacent invariants and holds the 90% floor.
tier1 = [
    "flavite-fs",
    "flavite-syntax",
    "flavite-encoding",
    "flavite-text-search",
    "flavite-buffer",
    "flavite-vault",
    "flavite-index",
    "flavite-workspace",
    "flavite-graph-protocol",
]
# Tier 2 (§10.5: ≥ 80% line coverage floor).
tier2 = ["flavite-api", "flavite-graph", "flavite-theme", "flavite-settings"]
# Tier 3 — measured, not gating until Phase 6 (§10.5).
tier3 = ["flavite-cli", "flavite-editor", "flavite-ui", "flavite-app"]
# The isolated source-matching helper is a packaged binary (RFC-0006 §6.2/
# D-14): pure matching over framed IPC, measured not floor-gated (§10.5).
tier3_helper = ["flavite-text-search-worker"]

[responsibilities]
flavite-graph-protocol = "IO-free bounded durable graph scope value types shared by core and workspace (RFC-0003 W08)"
flavite-fs = "Fs trait, atomic_write, watcher, path safety; FaultFs behind feature \"fault\" (§4.1)"
flavite-syntax = "Scanner, frontmatter patcher, pulldown glue — pure, IO-free (§4.1)"
flavite-encoding = "Strict ASCII/UTF-8/UTF-16 codecs, source-format descriptors, encoded↔decoded byte maps — std-only, IO-free (RFC-0006 §6.10)"
flavite-text-search = "Literal/regex source matches, match options, captures and replacement-template expansion over borrowed normalized UTF-8 — no editor/buffer authority (RFC-0006 §4.1)"
flavite-text-search-worker = "Isolated source-matching helper binary: framed match/template pages only, self-limited memory, no IO beyond stdin/stdout (RFC-0006 §6.2, D-14)"
flavite-index = "SQLite, tantivy, resolver, query exec (§4.1)"
flavite-buffer = "EditorModel/ropey, undo tree, D7 state machine (§4.1)"
flavite-vault = "Session/BufferManager ownership + actors, journal, history, recovery (§4.1)"
flavite-api = "Registry, typed commands/results, revisioned views, events, capabilities (§4.1)"
flavite-graph = "Layout, spatial — CPU only (§4.1)"
flavite-theme = "Theme package codec: parse browser .xpi themes, map them onto the semantic surface, bounded image/APNG decode — pure, IO-free"
flavite-settings = "Settings descriptors, registry, v2 TOML codec, and chord parsing — pure, IO-free (RFC-0007 S1)"
flavite-cli = "Headless CLI; consumes flavite-api (D16 dogfood) (§4.1)"
flavite-workspace = "IO-free workspace model: layout tree, tab groups, typed transactions, geometry (RFC-0003 D-02)"
flavite-editor = "iced widget over EditorModel (iced permitted here and in flavite-ui only) (§4.1)"
flavite-ui = "iced shell library: views, host catalog, adapters (§4.1; no binary)"
flavite-app = "Desktop application entry point; binary `flavite` (RFC-0003 TD-02/W13)"

[edges]
# Active internal edges for this checkout. A4 initially records the
# implemented edges, not future dependencies on empty crates (§10.2).
# Each edge-adding slice updates this list AND regenerates artifacts
# (`cargo xtask arch gen`) in the same PR — an architecture change is a
# spec change.
#
# Current state (B5): flavite-fs has no internal deps. xtask depends on
# workspace crates but is tooling (not gated). All other crates are empty
# skeletons with no internal edges yet, except:
#
#   flavite-ui → flavite-graph   (PLAN-B slice B2)
#   flavite-index → flavite-syntax (C7 - index uses syntax for attachment extensions)
#   flavite-graph → flavite-index (B5 - graph feed polls index.generation)
#   flavite-buffer → flavite-syntax (PLAN-A - text snapshot/coordinate types)
#   flavite-editor → flavite-api, flavite-buffer, flavite-syntax (A7 - custom
#   iced editor consumes revisioned views and emits typed Session commands)
#
# `flavite-ui::graph` consumes `flavite_graph::GraphSnapshot` as the
# CPU-authoritative model behind an `Arc` (D15); `flavite-graph` stays
# cpu-only, so the edge points one way only and `cargo xtask arch check`'s
# layering rule still holds. The graph → index edge is for the GraphFeed
# which polls the index's generation and consumes the invalidation feed (§4.14).
active = [
    { from = "flavite-api", to = "flavite-graph" },
    { from = "flavite-graph", to = "flavite-graph-protocol" },
    { from = "flavite-workspace", to = "flavite-graph-protocol" },
    { from = "flavite-ui", to = "flavite-graph" },
    { from = "flavite-index", to = "flavite-syntax" },
    { from = "flavite-buffer", to = "flavite-syntax" },
    # RFC-0006 S00/S01: the encoding boundary sits below syntax; the source
    # matcher borrows syntax coordinates. syntax/buffer/vault/api → encoding;
    # vault/api → text-search (§4 exact edges; no editor/buffer/index edge).
    { from = "flavite-syntax", to = "flavite-encoding" },
    { from = "flavite-buffer", to = "flavite-encoding" },
    { from = "flavite-vault", to = "flavite-encoding" },
    { from = "flavite-api", to = "flavite-encoding" },
    { from = "flavite-index", to = "flavite-encoding" },
    { from = "flavite-text-search", to = "flavite-syntax" },
    # S03/D-14: the helper wraps only the matcher; the parent locates the
    # installed sibling by path, never a dependency inversion.
    { from = "flavite-text-search-worker", to = "flavite-text-search" },
    { from = "flavite-vault", to = "flavite-text-search" },
    { from = "flavite-api", to = "flavite-text-search" },
    # flavite-vault dependencies
    { from = "flavite-vault", to = "flavite-buffer" },
    { from = "flavite-vault", to = "flavite-fs" },
    { from = "flavite-vault", to = "flavite-index" },
    { from = "flavite-vault", to = "flavite-syntax" },
    # C14 - flavite-api depends on core tier crates
    { from = "flavite-api", to = "flavite-vault" },
    { from = "flavite-api", to = "flavite-index" },
    { from = "flavite-api", to = "flavite-buffer" },
    { from = "flavite-api", to = "flavite-syntax" },
    { from = "flavite-api", to = "flavite-fs" },
    # XPI themes: the facade owns installed-theme storage and typed theme
    # commands over the pure package codec; the shell consumes the codec's
    # semantic model and decoded images for rendering.
    { from = "flavite-api", to = "flavite-theme" },
    { from = "flavite-ui", to = "flavite-theme" },
    # RFC-0007 S2: Settings store and commands consume the pure settings codec.
    { from = "flavite-api", to = "flavite-settings" },
    # RFC-0007 S3: UI and CLI consume settings directly for compatibility types.
    { from = "flavite-ui", to = "flavite-settings" },
    { from = "flavite-cli", to = "flavite-settings" },
    # RFC-0007 S4: Workspace layout storage now vault-scoped.
    { from = "flavite-api", to = "flavite-workspace" },

    # C14 - CLI consumes flavite-api only (D16 dogfood - fully migrated)
    { from = "flavite-cli", to = "flavite-api" },
    # B7 - Card layer uses API and buffer for production wiring
    { from = "flavite-ui", to = "flavite-api" },
    { from = "flavite-ui", to = "flavite-buffer" },
    # W01 - the actual shell hosts the custom editor widget.
    { from = "flavite-ui", to = "flavite-editor" },
    # Headless-only dev dependencies for the app pump event adapter test.
    { from = "flavite-ui", to = "flavite-fs" },
    { from = "flavite-ui", to = "flavite-index" },
    { from = "flavite-ui", to = "flavite-vault" },
    # RFC-0006 S02: viewport re-exports the canonical syntax boundary
    # primitives (flavite_editor::viewport::… delegates to syntax::text).
    { from = "flavite-ui", to = "flavite-syntax" },
    # Test-support feature unification: the crate enables its own
    # test-support feature for unit/integration tests via a self
    # dev-dependency (production builds never enable it).
    { from = "flavite-editor", to = "flavite-editor" },
    # A7 - custom editor widget consumes API views and EditorModel types
    { from = "flavite-editor", to = "flavite-api" },
    { from = "flavite-editor", to = "flavite-buffer" },
    { from = "flavite-editor", to = "flavite-syntax" },
    # W02 - the shell reduces authoritative layout through the IO-free model.
    { from = "flavite-ui", to = "flavite-workspace" },
    # W10/TD-02 - the production binary launches the shell library.
    { from = "flavite-app", to = "flavite-ui" },
]

[layering]
# Core-tier crates whose transitive closure of normal+build deps MUST NOT
# contain any forbidden crate (§10.2 check 3).
core_tier = [
    "flavite-fs",
    "flavite-syntax",
    "flavite-encoding",
    "flavite-text-search",
    "flavite-index",
    "flavite-buffer",
    "flavite-vault",
    "flavite-api",
    "flavite-graph",
    "flavite-graph-protocol",
    "flavite-workspace",
    "flavite-theme",
    "flavite-cli",
    "flavite-settings",
]
# Forbidden in core-tier transitive closure (normal+build deps only;
# dev-deps are exempt but listed in the artifact).
forbidden = ["iced", "iced_*", "winit", "wgpu", "cosmic-text"]
# UI crates — the only crates that MAY depend on forbidden crates.
ui_crates = ["flavite-editor", "flavite-ui"]

[first_party_externals]
# External deps tracked as nodes in the crate graph (§10.2).
names = [
    "iced",
    "iced_runtime",
    "iced_winit",
    "accesskit",
    "accesskit_winit",
    "winit",
    "wgpu",
    "cosmic-text",
    "ropey",
    "rusqlite",
    "tantivy",
    "pulldown-cmark",
    "notify",
    "tree-sitter",
    "blake3",
    "zstd",
    "nucleo",
    "nucleo-matcher",
    "image",
    "tracing",
    "similar",
    "zip",
]
