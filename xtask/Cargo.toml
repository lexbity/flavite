[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Development tooling: arch graph generation, verification, query CLI (§10.2)"
# The `cargo xtask` alias is `cargo run -p xtask --`; with multiple binaries in
# this package, `cargo run` needs a default. The spike probes are invoked
# explicitly with `--bin` (e.g. `just spike-s3`).
default-run = "cargo-xtask"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "cargo-xtask"
path = "src/main.rs"

# S1 IME event-delivery probe (§9 Phase 0 spike S1, PLAN-A slice A5).
# xtask is dev tooling, not a product crate: it is not layering-gated (§4.1,
# §10.2 — "xtask → any (tooling)"), and the probe is the spike's instrument.
[[bin]]
name = "s1_ime_probe"
path = "src/bin/s1_ime_probe.rs"

# S1 caret geometry and hit-test probe (§9 Phase 0 spike S1, PLAN-A slice A6).
[[bin]]
name = "s1_caret_probe"
path = "src/bin/s1_caret_probe.rs"

[dependencies]
anyhow = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
# iced for the S1 probe widget (slice A5). The `advanced` feature gates
# `iced::advanced`, where the custom `Widget` trait lives. Default features
# (wgpu + tiny-skia + x11 + wayland) match what flavite-editor/flavite-ui
# will run with, so the probe exercises the real delivery path.
iced = { workspace = true, features = ["advanced"] }
# cosmic-text for the caret probe (slice A6).
cosmic-text = "0.15"
# S3 watcher-truth probe (PLAN-C C1): the same crate and major the production
# watcher wrapper (flavite-fs `watch.rs`, slice C5) will use (§2, D5).
notify = { workspace = true }
# S4 search probe (PLAN-C C3): the same tantivy major the production index
# adapter (C7 `tantivy.rs`) will use (§2, D12).
tantivy = { workspace = true }
# S4 search probe (PLAN-C C3): the diagnostic SQLite mirror (§4.14) that the
# checkpoint-publication scenario crashes around. `bundled` keeps the probe
# self-contained; WAL concurrency itself is C4's job.
rusqlite = { workspace = true, features = ["bundled"] }
# S4 DB probe (PLAN-C C4): the `content_hash` column of the §4.3 schema, hashed
# the same way production will (§4.3), so batch-apply cost includes it.
blake3 = { workspace = true }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
