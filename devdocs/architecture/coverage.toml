# Coverage floors (§10.5).
# Consumed by `cargo xtask cov-check` and rendered into DEPENDENCIES.md.
# Floors are enforced on Linux (G1); macOS/Windows report but do not gate.

[floors]
# Tier → minimum line coverage percentage.
tier1 = 90.0
tier2 = 80.0
# Tier 3 is measured and reported, not gating.
tier3 = 0.0

# Temporary, reviewed waivers from the fresh workspace coverage run on
# 2026-10-28. Each expires after 30 days; expired or malformed waivers fail G1.
[waivers.flavite-index]
floor = 87.5
expires = "2026-11-30"
reason = "Index actor error and cache-recovery branches remain uncovered; raise the floor after the next index fault-path test slice."

[waivers.flavite-fs]
floor = 86.8
expires = "2026-11-30"
reason = "Platform-specific filesystem failure branches remain uncovered in the Linux report; add portable FaultFs cases before expiry."

[waivers.flavite-vault]
floor = 84.4
expires = "2026-11-30"
reason = "Actor shutdown and uncommon journal-recovery branches remain uncovered; add deterministic fault cases before expiry."

[crates]
# Crate → tier mapping. A crate with zero executable lines reports N/A
# and is inactive for floors; the first executable implementation
# activates its floor in the same slice (§10.5).
flavite-fs = "tier1"
flavite-syntax = "tier1"
flavite-buffer = "tier1"
flavite-vault = "tier1"
flavite-index = "tier1"
flavite-workspace = "tier1"
flavite-api = "tier2"
flavite-graph = "tier2"
flavite-cli = "tier3"
flavite-editor = "tier3"
flavite-ui = "tier3"
