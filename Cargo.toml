[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flavite/flavite"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# UI framework (permitted only in flavite-editor and flavite-ui — §4.1/§10.2)
iced = { version = "0.14", features = ["tokio"] }
cosmic-text = "0.15"
# Core
ropey = "1.6"
rusqlite = "0.41"
tantivy = "0.27"
pulldown-cmark = "0.13"
notify = "8"
tree-sitter = "0.27"
tree-sitter-md = "0.5"
unicode-segmentation = "1"
nucleo-matcher = "0.3"
blake3 = "1"
zstd = "0.14"
tracing = "0.1"
crossbeam = "0.8"
# Layout worker (PLAN-B B3, D15): rayon for the Barnes-Hut force pass,
# arc-swap for the lock-free position double buffer.
rayon = "1"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling (§10.4 convention: thiserror for libraries, anyhow for binaries)
thiserror = "2"
anyhow = "1"
# Testing
proptest = "1"
tempfile = "3"
# Dev tooling (xtask)
walkdir = "2"
# Project directories
directories = "5"
# Serialization
hex = "0.4"
toml = "0.8"
# Fuzzy matching (§4.7: command palette + quick switcher are in-memory nucleo)
nucleo = "0.5"

[patch.crates-io]
iced_program = { path = "vendor/iced-accessibility/iced_program" }
iced_runtime = { path = "vendor/iced-accessibility/iced_runtime" }
iced_winit = { path = "vendor/iced-accessibility/iced_winit" }
