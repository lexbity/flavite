[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flavite/flavite"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# UI framework (permitted only in flavite-editor and flavite-ui — §4.1/§10.2)
iced = "0.14"
# Core
ropey = "1.6"
rusqlite = "0.41"
tantivy = "0.27"
pulldown-cmark = "0.13"
notify = "8"
tree-sitter = "0.27"
blake3 = "1"
zstd = "0.14"
nucleo = "0.5"
image = "0.25"
tracing = "0.1"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling (§10.4 convention: thiserror for libraries, anyhow for binaries)
thiserror = "2"
anyhow = "1"
# Testing
proptest = "1"
# Dev tooling (xtask)
walkdir = "2"
