[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flavite/flavite"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# UI framework (permitted only in flavite-editor and flavite-ui — §4.1/§10.2)
iced = "0.14"
# Core
ropey = "1.6"
rusqlite = "0.41"
tantivy = "0.27"
pulldown-cmark = "0.13"
notify = "8"
tree-sitter = "0.27"
# Markdown grammar for tree-sitter (D10's editor-side structure source).
# Published as `tree-sitter-md` (the tree-sitter-grammars/tree-sitter-markdown
# grammar); the `tree-sitter-markdown` crate name on crates.io is a stale 2021
# release pinned to a pre-0.20 tree-sitter.
tree-sitter-md = "0.5"
# YAML 1.2 core-schema parser (D11: `no` must stay text — the Norway problem).
saphyr = "0.3"
saphyr-parser = "0.3"
unicode-segmentation = "1"
blake3 = "1"
zstd = "0.14"
nucleo = "0.5"
image = "0.25"
tracing = "0.1"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling (§10.4 convention: thiserror for libraries, anyhow for binaries)
thiserror = "2"
anyhow = "1"
# Testing
proptest = "1"
# Dev tooling (xtask)
walkdir = "2"
