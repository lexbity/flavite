[package]
name = "flavite-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Layout, spatial — CPU only (§4.1)"

# Internal dependencies: none (§4.1, TD-12/W07). The SQLite-backed index
# feed bridge moved to `flavite-api::graph_service`; this crate consumes the
# plain DTOs in `protocol` and applies them in `feed`. CPU-only — no
# iced/GPU/winit/AccessKit dependencies, no database, no filesystem, ever
# (enforced by `cargo xtask arch check`).
[dependencies]
flavite-graph-protocol = { path = "../flavite-graph-protocol" }
arc-swap = { workspace = true }
crossbeam = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# Zero-dependency benchmark harness (PLAN-B §5: `cargo bench -p
# flavite-graph`), with warmup + samples + a p50/p95/p99 table. See
# `benches/layout.rs` for the rationale (no criterion: the measurement is a
# percentile table over a fixed fixture, not a comparison of means).
[[bench]]
name = "layout"
harness = false
