[package]
name = "flavite-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IO-free workspace model: layout tree, context identities, transactions (RFC-0003 D-02)"

# D-02: the workspace model is IO-free and toolkit-free. It depends on
# nothing outside the standard library so layout fuzzers and property tests
# never run through a GUI dependency closure.
[dependencies]
# Device-local workspace codec (W06): bounded JSON serialization with a
# canonical payload checksum. Pure libraries; the model stays IO-free (D-02).
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
