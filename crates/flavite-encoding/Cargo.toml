[package]
name = "flavite-encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Strict ASCII/UTF-8/UTF-16 codecs, SourceFormat descriptor and encoded↔decoded byte maps; pure, IO-free (RFC-0006 §6.10, D-15)"

[features]
# Optional validated serialization of SourceFormat using the existing
# workspace serde. Contains no codec behavior (§6.10).
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
