[package]
name = "flavite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless CLI; consumes flavite-api (D16 dogfood) (§4.1)"

[[bin]]
name = "flavite"
path = "src/main.rs"

[dependencies]
# Workspace crates
# Phase 4: CLI consumes flavite-api only (D16 dogfood)
flavite-api = { path = "../flavite-api" }

# CLI parsing
clap = { version = "4", features = ["derive", "cargo"] }

# Error handling (binary — anyhow)
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization (for doctor --json)
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Filesystem

# Time handling (for doctor timestamps)

[dev-dependencies]
# Testing utilities
