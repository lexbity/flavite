[package]
name = "flavite-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite, tantivy, resolver, query exec (§4.1)"

[dependencies]
# Core deps
rusqlite = { workspace = true, features = ["bundled"] }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pulldown-cmark = { workspace = true }
tantivy = { workspace = true }
tracing = { workspace = true }

# Internal deps
flavite-syntax = { path = "../flavite-syntax" }

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# RFC-0004 S2: apply-transaction wall bench (no criterion; manual timing, see
# `crates/flavite-graph/benches/layout.rs` for the rationale).
[[bench]]
name = "apply_and_search"
harness = false
