[package]
name = "flavite-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fs trait, atomic_write, watcher, path safety; FaultFs behind feature \"fault\" (§4.1)"

[features]
# FaultFs — scriptable fault injection over any Fs. A library, not #[cfg(test)] (§10.6).
fault = []

[dependencies]
blake3 = { workspace = true }
thiserror = { workspace = true }
# File system notification library for the watcher wrapper
notify = { workspace = true }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

# Retained replacement exchange (RFC-0006 D-10/§6.5): Linux implements the
# atomic file exchange with renameat2(RENAME_EXCHANGE). Verified in the
# lock; the dependency is Linux-only so other platforms keep an honest
# Unsupported (never an unlink+rename emulation).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38", features = ["fs"] }

cap-std = "4"

[dev-dependencies]
proptest = { workspace = true }
# notify crate is used by the watcher wrapper; also needed for dev tests.
notify = { workspace = true }
tempfile = "3"
