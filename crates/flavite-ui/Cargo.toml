[package]
name = "flavite-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "iced application (§4.1)"

[dependencies]
# iced/wgpu are permitted here (and in flavite-editor) only — §4.1/§10.2;
# `cargo xtask arch check` enforces the layering rule transitively.
iced = { workspace = true }
iced_winit = "=0.14.1"
accesskit = "=0.25.2"
iced_runtime = "=0.14.0"
# §4.7/D1: the command palette matches registry commands in memory with nucleo.
nucleo = { workspace = true }
flavite-graph = { path = "../flavite-graph" }
flavite-api = { path = "../flavite-api" }
flavite-buffer = { path = "../flavite-buffer" }
flavite-editor = { path = "../flavite-editor" }
# D-02: the shell reduces authoritative layout through the IO-free model.
flavite-workspace = { path = "../flavite-workspace" }
serde = { workspace = true }
serde_json = { workspace = true }
# §10.4 convention: thiserror for libraries. Used for the CPU-side geometry
# error type (`graph::instance::GeometryError`).
thiserror = { workspace = true }
toml = { workspace = true }

[features]
# Fixture/harness support for integration tests and the visual runner. The
# production build never compiles the harness module (RFC-0003 §16.2).
ui-test-support = []

[dev-dependencies]
# Headless wgpu validation tests drive wgpu's async device/adapter futures.
futures = "0.3"
# Fixture vaults for app-state and pump tests.
tempfile = { workspace = true }
flavite-fs = { path = "../flavite-fs" }
flavite-index = { path = "../flavite-index" }
flavite-vault = { path = "../flavite-vault" }
uuid = { version = "1", features = ["v4"] }
# Headless WGSL validation: parses/validates the probe's shader and asserts
# the Rust ↔ WGSL uniform layout contract without needing a GPU adapter, so
# the shader gate runs on every CI platform (PLAN-B §5 B2).
naga = { version = "27", features = ["wgsl-in"] }
