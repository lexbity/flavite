[package]
name = "flavite-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Session/BufferManager ownership + actors, journal, history, recovery (§4.1)"

[dependencies]
flavite-fs = { path = "../flavite-fs" }
flavite-syntax = { path = "../flavite-syntax" }
flavite-index = { path = "../flavite-index" }
flavite-buffer = { path = "../flavite-buffer" }

# Threading and synchronization (D3: named threads + bounded channels)
crossbeam = { workspace = true }
directories = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }

# Hashing
blake3 = { workspace = true }
zstd = { workspace = true }

# UUIDs
uuid = { version = "1", features = ["v7", "serde"] }

# Tracing
 tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
similar = "2.7"

[dev-dependencies]
# For tests
tempfile = { workspace = true }
proptest = { workspace = true }
flavite-fs = { path = "../flavite-fs", features = ["fault"] }

[features]
default = []
fault = ["flavite-fs/fault"]

[[bench]]
name = "reconcile_concurrency"
harness = false
