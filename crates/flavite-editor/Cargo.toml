[package]
name = "flavite-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "iced widget over EditorModel (iced permitted here and in flavite-ui only) (§4.1)"

[dependencies]
iced = { workspace = true, features = ["advanced"] }
cosmic-text = { workspace = true }
flavite-api = { path = "../flavite-api" }
flavite-buffer = { path = "../flavite-buffer" }
flavite-syntax = { path = "../flavite-syntax" }
flavite-edit-context = { path = "../flavite-edit-context" }
nucleo-matcher = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

[features]
# Test-only constructors (`EditorWidget::new` copy view, `state_for_test`).
# Production shells build through `from_view`; deterministic tests and
# fixture harnesses enable this feature (flavite-ui's `ui-test-support`
# turns it on transitively).
test-support = []

[dev-dependencies]
# The crate enables its own test-support feature for its unit and
# integration tests.
flavite-editor = { path = ".", features = ["test-support"] }
