[package]
name = "flavite-buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EditorModel/ropey, undo tree, D7 state machine (§4.1)"

[dependencies]
# Pure Rust text buffer
ropey = { workspace = true }
# Stamp-transition wakes (RFC-0005 §5.1 BufferSignal): bounded(1) lossy channel
crossbeam = { workspace = true }
# Text snapshot and coordinate types from flavite-syntax
flavite-syntax = { path = "../flavite-syntax" }
# Serialization for recovery files
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }
# Hashing for content addressing
blake3 = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
